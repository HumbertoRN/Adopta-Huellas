{% extends 'adopciones/base.html' %}

{% block title %}Iniciar sesión | Adopta Huellas{% endblock %}

{% block content %}
<div class="max-w-sm mx-auto mt-16 p-8 bg-white border border-slate-200 rounded-2xl shadow-md">

    <h2 class="font-titulo text-2xl font-extrabold text-guinda mb-6 text-center">Iniciar sesión</h2>

    {% if error %}
        <div class="mb-4 p-3 text-sm text-red-700 bg-red-50 border border-red-200 rounded-md">{{ error }}</div>
    {% endif %}

    <form method="POST" class="flex flex-col gap-4">
        {% csrf_token %}

        <input type="text" name="username" placeholder="Usuario" required
               class="w-full px-4 py-2 border border-slate-300 rounded-md focus:outline-none focus:ring-2 focus:ring-guinda">

        <input type="password" name="password" placeholder="Contraseña" required
               class="w-full px-4 py-2 border border-slate-300 rounded-md focus:outline-none focus:ring-2 focus:ring-guinda">

        <button type="submit"
                class="w-full mt-2 bg-guinda hover:bg-guinda-dark text-white font-semibold py-2 px-4 rounded-md transition-colors">
            Ingresar
        </button>
    </form>

    <p class="mt-6 text-sm text-center text-slate-500">
        ¿No tienes cuenta? <a href="{% url 'register' %}" class="text-guinda font-semibold hover:underline">Regístrate</a>
    </p>
</div>
{% endblock %}
