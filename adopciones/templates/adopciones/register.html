{% extends 'adopciones/base.html' %}

{% block title %}Registro | Adopta Huellas{% endblock %}

{% block content %}
<div class="max-w-md mx-auto mt-16 p-8 bg-white border border-slate-200 rounded-2xl shadow-md">

    <h2 class="font-titulo text-2xl font-extrabold text-guinda mb-6 text-center">Crear cuenta</h2>

    
    <form method="POST" class="
        [&>p]:mb-4
        [&>p>label]:block [&>p>label]:text-sm [&>p>label]:font-medium [&>p>label]:text-slate-700 [&>p>label]:mb-1
        [&>p>input]:w-full [&>p>input]:px-4 [&>p>input]:py-2 [&>p>input]:border [&>p>input]:border-slate-300 [&>p>input]:rounded-md [&>p>input]:focus:outline-none [&>p>input]:focus:ring-2 [&>p>input]:focus:ring-guinda
        [&>p>span.helptext]:block [&>p>span.helptext]:text-xs [&>p>span.helptext]:text-slate-500 [&>p>span.helptext]:mt-1
        [&_ul.errorlist]:text-sm [&_ul.errorlist]:text-red-600 [&_ul.errorlist]:mb-2
    ">
        {% csrf_token %}

      
        {{ form.as_p }}

        <button type="submit"
                class="w-full mt-2 bg-guinda hover:bg-guinda-dark text-white font-semibold py-2 px-4 rounded-md transition-colors">
            Registrarse
        </button>
    </form>

    <p class="mt-6 text-sm text-center text-slate-500">
        ¿Ya tienes cuenta? <a href="{% url 'login' %}" class="text-guinda font-semibold hover:underline">Inicia sesión</a>
    </p>
</div>
{% endblock %}
